name: Flutter CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Code Analysis & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxi-dev \
            liblzma-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libasound2-dev \
            libpulse-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis
        run: dart analyze --fatal-infos

      - name: Run unit & integration tests
        run: flutter test --coverage

      - name: Upload code coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android (APK & AAB)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android Release Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: device-assistant-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: device-assistant-android-bundle
          path: build/app/outputs/bundle/release/app-release.aab

  build-linux:
    name: Build Linux Desktop Bundle
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxi-dev \
            liblzma-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libasound2-dev \
            libpulse-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release Bundle
        run: flutter build linux --release

      - name: Compress Linux Bundle
        run: |
          tar -czvf device-assistant-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: device-assistant-linux-x64
          path: device-assistant-linux-x64.tar.gz

  build-windows:
    name: Build Windows Desktop Executable
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release Executable
        run: flutter build windows --release

      - name: Compress Windows Release Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath device-assistant-windows-x64.zip

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: device-assistant-windows-x64
          path: device-assistant-windows-x64.zip

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: device-assistant-android-apk
          path: release-assets/

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: device-assistant-android-bundle
          path: release-assets/

      - name: Download Linux Bundle
        uses: actions/download-artifact@v4
        with:
          name: device-assistant-linux-x64
          path: release-assets/

      - name: Download Windows Bundle
        uses: actions/download-artifact@v4
        with:
          name: device-assistant-windows-x64
          path: release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/app-release.apk
            release-assets/app-release.aab
            release-assets/device-assistant-linux-x64.tar.gz
            release-assets/device-assistant-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
